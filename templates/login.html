{% extends "base.html" %}
{% block title %}ورود | PC Zone{% endblock %}
{% block content %}
<div class="container auth-page">
    <div class="auth-box">
        <h1>ورود به حساب</h1>
        <form method="POST">
            <div class="form-group">
                <label>نام کاربری</label>
                <input type="text" name="username" required>
            </div>
            <div class="form-group">
                <label>رمز عبور</label>
                <input type="password" name="password" required>
            </div>
            <button type="submit" class="btn-primary big">ورود</button>
        </form>
        <p class="auth-link">حساب ندارید؟ <a href="/register">ثبت‌نام کنید</a></p>
    </div>
</div>
{% endblock %}
